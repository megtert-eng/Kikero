<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eseti kikérő</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #0f3460, #533483);
      padding: 28px 28px 22px;
      text-align: center;
    }

    .card-header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: white;
      letter-spacing: -0.3px;
    }

    .card-header .subtitle {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }

    .card-body {
      padding: 24px 28px 28px;
    }

    #uzenet {
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }
    #uzenet.siker { background: #d1fae5; color: #065f46; display: block; border: 1px solid #6ee7b7; }
    #uzenet.hiba { background: #fee2e2; color: #991b1b; display: block; border: 1px solid #fca5a5; }

    #bejelentkezve {
      font-size: 0.8rem;
      color: #6b7280;
      margin-bottom: 4px;
      min-height: 18px;
    }

    #bejelentkezesGomb {
      width: 100%;
      padding: 11px;
      background: white;
      color: #374151;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #bejelentkezesGomb:hover {
      border-color: #9ca3af;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      background: white;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      margin-top: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="date"], input[type="email"], input[type="text"], select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #111827;
      background: #f9fafb;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #0f3460;
      box-shadow: 0 0 0 3px rgba(15,52,96,0.1);
      background: white;
    }

    .row {
      display: flex;
      gap: 12px;
    }
    .row > div { flex: 1; }

    #kuldesGomb {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0f3460, #533483);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 24px;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.1s;
    }
    #kuldesGomb:hover { opacity: 0.92; transform: translateY(-1px); }
    #kuldesGomb:active { transform: translateY(0); }
    #kuldesGomb:disabled { background: #d1d5db; color: #9ca3af; cursor: not-allowed; transform: none; }

    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    #modal.aktiv { display: flex; }

    #modalKartya {
      background: white;
      border-radius: 20px;
      padding: 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    }
    #modalKartya h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 16px;
    }
    #modalElonezet {
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.88rem;
      color: #374151;
      white-space: pre-wrap;
      margin-bottom: 20px;
      line-height: 1.6;
      font-family: inherit;
    }
    .modalGombok {
      display: flex;
      gap: 10px;
    }
    .modalGombok button {
      margin-top: 0;
      flex: 1;
      padding: 13px;
      font-size: 0.95rem;
    }
    #modalMegse {
      background: #f3f4f6;
      color: #374151;
      border: none;
      border-radius: 10px;
    }
    #modalMegse:hover { background: #e5e7eb; }
    #modalKuldes {
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>Eseti kikérő</h1>
      <div class="subtitle" id="bejelentkezveHeader">Nincs bejelentkezve</div>
    </div>
    <div class="card-body">

      <div id="uzenet"></div>

      <button id="bejelentkezesGomb">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Bejelentkezés Google fiókkal
      </button>

      <label for="gyerekNev">Gyermek neve</label>
      <input type="text" id="gyerekNev" value="" placeholder="pl. Kovács Péter">

      <label for="osztaly">Osztály</label>
      <input type="text" id="osztaly" value="" placeholder="pl. 3.b">

      <label for="celEmail">Iskola email címe</label>
      <input type="email" id="celEmail" value="esetikikeroveroceiskola@gmail.com">

      <label for="datum">Dátum</label>
      <input type="date" id="datum">

      <div class="row">
        <div>
          <label for="ora">Óra</label>
          <select id="ora"></select>
        </div>
        <div>
          <label for="perc">Perc</label>
          <select id="perc"></select>
        </div>
      </div>

      <button id="kuldesGomb" disabled>Kikérő küldése</button>
    </div>
  </div>

  <div id="modal">
    <div id="modalKartya">
      <h2>Biztosan elküldi a kikérőt?</h2>
      <div id="modalElonezet"></div>
      <div class="modalGombok">
        <button id="modalMegse">Mégsem</button>
        <button id="modalKuldes">Küldés</button>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
